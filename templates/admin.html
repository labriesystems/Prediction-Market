{% extends 'base.html' %}{% block content %}<header><p class="eyebrow">ADMIN</p><h1>Resolve questions</h1></header>{% if not session.admin %}<form method="post" class="panel"><label>Admin key<input type="password" name="key" required></label><button>Unlock</button></form>{% else %}{% for market in markets %}<section class="card"><h2>{{ market.question }}</h2><form method="post" action="{{ url_for('resolve',market_id=market.id) }}"><button name="outcome" value="1" class="yes">Resolve YES</button><button name="outcome" value="0" class="no">Resolve NO</button></form></section>{% endfor %}{% endif %}{% endblock %}
