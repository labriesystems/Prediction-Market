{% extends 'base.html' %}

{% block title %}Prediction Market{% endblock %}

{% block content %}

<section class="hero">

  <h1>Track your predictions over time.</h1>

  <p>
    Make probability estimates and measure your accuracy over time.
  </p>

  <form method="post" class="login">

    <label>
      Username
      <input
        name="username"
        maxlength="24"
        autofocus
        required
        placeholder="username"
      >
    </label>

    <button>Start</button>

  </form>

  <small>No password required.</small>

  <footer class="start-footer">
    <span>LaBrie Systems</span>
    <span>labriesystems@gmail.com</span>
  </footer>

</section>

{% endblock %}
