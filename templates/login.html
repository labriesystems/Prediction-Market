{% extends 'base.html' %}

{% block title %}Log In · Prediction Market{% endblock %}

{% block content %}

<section class="hero">

  <h1>Track your predictions over time.</h1>

  <p>
    Make probability estimates and measure your accuracy over time.
  </p>

  <form method="post" class="login">

    <label>
      Username
      <input
        name="username"
        maxlength="24"
        autocomplete="username"
        required
        autofocus
      >
    </label>

    <label>
      Password
      <input
        type="password"
        name="password"
        autocomplete="current-password"
        required
      >
    </label>

    <button>Log in</button>

  </form>

  <p class="auth-switch">
    New here?
    <a href="{{ url_for('register') }}">Create an account</a>
  </p>

  <footer class="start-footer">
    <span>LaBrie Systems</span>
    <span>labriesystems@gmail.com</span>
  </footer>

</section>

{% endblock %}
