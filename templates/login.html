{% extends 'base.html' %}
{% block title %}Prediction Market{% endblock %}

{% block content %}
<section class="hero">
  <h1>Track your predictions over time.</h1>
  <p>Make probability estimates, measure your accuracy, and use play credits to test your predictions.</p>

  <form method="post" class="login">
    <label>
      Username
      <input name="username" maxlength="24" autofocus required placeholder="username">
    </label>
    <button>Start</button>
  </form>

  <small>No password required.</small>
</section>
{% endblock %}
